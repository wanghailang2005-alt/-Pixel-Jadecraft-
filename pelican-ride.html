<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9f4f7">
  <title>骑慢一点 · 鹈鹕的海边兜风</title>
  <style>
    :root{color-scheme:light;--ink:#254c59;--muted:#5e7981;--paper:#e9f4f7;--accent:#d65545}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    main{width:min(1160px,calc(100% - 64px));margin:0 auto;padding:42px 0 26px}
    header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 27px;gap:20px}
    h1{font-size:clamp(25px,3.2vw,39px);font-weight:650;letter-spacing:.06em;margin:0 0 10px}header p{font-size:14px;letter-spacing:.08em;margin:0;color:var(--muted)}
    .stamp{display:flex;align-items:center;gap:9px;font-size:13px;white-space:nowrap}.stamp svg{width:28px;height:28px}
    .scene{position:relative;overflow:hidden;border-radius:24px;background:#c8e7ef;box-shadow:0 16px 45px #46748012}
    .scene>svg{display:block;width:100%;height:auto}.scene-note{position:absolute;bottom:23px;left:30px;font-size:12px;color:#526e6e;letter-spacing:.14em}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:25px 2px 0}.buttons{display:flex;gap:10px}
    button{font:inherit;font-size:14px;cursor:pointer;border:1px solid #aec7cb;background:transparent;color:var(--ink);border-radius:30px;min-height:45px;padding:10px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .15s}
    button:hover{background:#d6e8ec}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:3px solid #d65545;outline-offset:5px}
    #toggle{background:var(--ink);color:white;border-color:var(--ink);min-width:120px}#toggle:hover{background:#356271}button svg{width:18px;height:18px}
    .speed{display:flex;align-items:center;gap:13px;font-size:13px}.speed label{white-space:nowrap}input{width:130px;accent-color:var(--ink);cursor:pointer}output{min-width:37px;font-variant-numeric:tabular-nums}
    footer{display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted);margin:26px 3px 0;line-height:1.7}.status{min-height:20px}
    @media(max-width:600px){main{width:calc(100% - 28px);padding-top:27px}header{margin-bottom:22px}.stamp span{display:none}.scene{border-radius:17px}.scene>svg{height:auto}.scene-note{left:17px;bottom:16px;font-size:10px}.controls{flex-wrap:wrap;gap:20px;margin-top:20px}.buttons{flex:1}.speed{width:100%;justify-content:center}input{flex:1;max-width:250px}footer{font-size:11px;margin-top:23px}button{padding:10px 17px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>今天，骑慢一点。</h1><p>跟一只鹈鹕，去海边兜兜风。</p></div>
    <div class="stamp"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14 3 3M6 26l3-3M23 9l3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>有海风的好天气</span></div>
  </header>
  <div class="scene">
  <svg id="landscape" viewBox="0 0 1200 700" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="scene-title">鹈鹕骑自行车的海边动画</title>
    <desc id="scene-desc">系着红围巾的白色鹈鹕骑一辆绿色自行车。双脚交替踩踏，车轮转动，云朵、海浪和路边花草向后移动。</desc>
    <defs>
      <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c6e5ef"/><stop offset="1" stop-color="#e3f2ec"/></linearGradient>
      <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#77babc"/><stop offset="1" stop-color="#b9dcd2"/></linearGradient>
      <linearGradient id="beak" x2="0" y2="1"><stop stop-color="#ffd479"/><stop offset="1" stop-color="#efab54"/></linearGradient>
      <pattern id="sea-lines" width="330" height="62" patternUnits="userSpaceOnUse"><path d="M12 15h80m130 10h64M135 47h54" fill="none" stroke="#e0f1df" stroke-width="3" stroke-linecap="round" opacity=".6"/></pattern>
      <pattern id="road-lines" width="250" height="160" patternUnits="userSpaceOnUse"><path d="M30 96h92" stroke="#fff9e6" stroke-width="5" stroke-linecap="round"/><path d="M170 53h22m-100 80h8" stroke="#bdc7ac" stroke-width="2" stroke-linecap="round"/></pattern>
      <g id="cloud" fill="#f7fbf4"><path d="M0 37C-6 19 10 10 25 15C29-9 63-10 73 12C94 2 112 18 110 30C131 25 141 38 135 45H0Z"/></g>
      <g id="wheel" fill="none"><circle r="83" stroke="#294d58" stroke-width="12"/><circle r="75" stroke="#f7edce" stroke-width="5"/><g class="spokes" stroke="#69888a" stroke-width="2"><path d="M-72 0H72M0-72V72M-51-51 51 51M-51 51 51-51M-66-28 66 28M-28-66 28 66M-66 28 66-28M-28 66 28-66"/><path d="M-56-47a73 73 0 0 1 18-15" stroke="#fff9de" stroke-width="5" stroke-linecap="round"/></g><circle r="8" fill="#e4e8d3" stroke="#294d58" stroke-width="3"/></g>
      <g id="grass" fill="none" stroke="#749b87" stroke-width="3" stroke-linecap="round"><path d="M0 0q-3-20-12-28M0 0q1-30 10-40M0 0q12-19 22-20"/></g>
      <g id="flowers"><use href="#grass"/><path d="M7-9 4-40" stroke="#749b87" stroke-width="2"/><g fill="#fff8e4" transform="translate(4 -42)"><ellipse ry="9" rx="4"/><ellipse ry="9" rx="4" transform="rotate(60)"/><ellipse ry="9" rx="4" transform="rotate(120)"/><circle r="3" fill="#e5ae51"/></g></g>
    </defs>
    <path fill="url(#sky)" d="M0 0h1200v700H0z"/>
    <circle cx="974" cy="116" r="51" fill="#fbf2c7"/>
    <circle cx="974" cy="116" r="65" fill="none" stroke="#f5f4dc" stroke-width="1" opacity=".6"/>
    <g id="clouds" opacity=".84"><use href="#cloud" x="112" y="100"/><use href="#cloud" transform="translate(780 63) scale(.66)"/><use href="#cloud" transform="translate(1100 175) scale(1.1)"/><use href="#cloud" x="1312" y="100"/><use href="#cloud" transform="translate(1980 63) scale(.66)"/><use href="#cloud" transform="translate(2300 175) scale(1.1)"/></g>
    <g fill="none" stroke="#789eaa" stroke-width="2.5" stroke-linecap="round"><path d="M338 113q10-10 20 0q10-10 20 0M850 180q7-7 14 0q7-7 14 0"/></g>
    <path fill="#95c1c2" d="M0 334q70-34 142-26t132 23q93-48 165-15t168 18q142-12 278-1t315-25v110H0Z"/>
    <path fill="url(#sea)" d="M0 342h1200v137H0z"/>
    <path fill="url(#sea-lines)" id="water" d="M0 353h1200v118H0z"/>
    <g id="sailboat" transform="translate(1000 353)"><path d="M-25 0h51l-9 10h-30Z" fill="#f5f0d7"/><path d="M0-55v51h-31Z" fill="#fff9e5"/><path d="M5-41v37h20Z" fill="#e5e9d5"/><path d="M1-59v61" stroke="#648d91" stroke-width="2"/></g>
    <path d="M0 451q200-13 402 3t399-1 399-4v63H0Z" fill="#d8dfba"/>
    <path d="M0 476q321-10 584 3t616-5v226H0Z" fill="#e3dfc3"/>
    <path d="M0 488q300-10 600 1t600-3" fill="none" stroke="#f6efd8" stroke-width="5"/>
    <path d="M0 495h1200v205H0z" fill="url(#road-lines)" id="road"/>
    <g id="back-plants"><use href="#grass" x="162" y="477"/><use href="#grass" x="956" y="480"/><use href="#flowers" x="1140" y="477"/><use href="#grass" x="1362" y="477"/><use href="#grass" x="2156" y="480"/><use href="#flowers" x="2340" y="477"/></g>
    <ellipse cx="617" cy="606" rx="248" ry="16" fill="#536f69" opacity=".12"/>
    <g id="rider" stroke="#294d58" stroke-linecap="round" stroke-linejoin="round">
      <!-- Far leg and pedal are drawn behind the bicycle. -->
      <path id="far-leg" d="M575 386 603 439 568 511" fill="none" stroke="#ce914b" stroke-width="13"/>
      <path id="far-foot" d="M557 511h29" fill="none" stroke="#ce914b" stroke-width="12"/>
      <g transform="translate(470 516)"><use href="#wheel"/><g id="rear-spin" stroke="#e9e6c8" stroke-width="5"><path d="M-54-44l9 8M54 44l-9-8"/></g></g>
      <g transform="translate(770 516)"><use href="#wheel"/><g id="front-spin" stroke="#e9e6c8" stroke-width="5"><path d="M-54-44l9 8M54 44l-9-8"/></g></g>
      <path d="M386 488a87 87 0 0 1 162-21M696 469a87 87 0 0 1 158 15" stroke="#518e83" stroke-width="7" fill="none"/>
      <path d="M470 516 558 419 600 511 470 516 698 419 600 511M698 419 770 516" fill="none" stroke="#294d58" stroke-width="15"/>
      <path d="M470 516 558 419 600 511 470 516M558 419H698L600 511M698 419 770 516" fill="none" stroke="#6db3a0" stroke-width="9"/>
      <path d="M556 419 548 391M698 419 681 367 711 356" fill="none" stroke="#294d58" stroke-width="8"/>
      <path d="M706 356h29q13 0 13 11t-12 10" fill="none" stroke="#294d58" stroke-width="7"/>
      <path d="M522 391q28-8 58-1l-2 10h-55q-9-3-1-9Z" fill="#af694e" stroke-width="3"/>
      <path d="M738 377q-21 25-9 62" fill="none" stroke-width="2"/>
      <circle cx="600" cy="511" r="25" fill="#e8e5cd" stroke-width="3"/><circle cx="600" cy="511" r="17" fill="#9abbb0" stroke-width="2"/>
      <path d="M470 506 596 487q32-2 31 24t-29 25L470 525q-14-8 0-19Z" fill="none" stroke="#557775" stroke-width="2"/>
      <path id="crank" d="M568 511H632" stroke-width="6" fill="none"/>
      <!-- Tail, pear-shaped body, and the long curved neck of a pelican. -->
      <g id="bird">
        <path d="M491 326q-39-5-64-29l17 42-21-2q26 28 68 20Z" fill="#e7ede1" stroke-width="3"/>
        <path d="M474 322c-7 36 17 67 60 73 48 8 87-17 99-54 8-27-6-48-3-73 2-19 19-34 37-43 26-14 30-38 13-56-17-19-45-15-61 3-18 21-14 47-19 69-7 29-23 40-49 43-33 1-65 10-77 38Z" fill="#fcf9e9" stroke-width="3.5"/>
        <path d="M481 343q10 47 59 45c48-1 69-29 73-60-29 30-84 43-132 15Z" fill="#dce5d9" stroke="none"/>
        <path d="M618 239q-2 44-28 61" fill="none" stroke="#cad9ce" stroke-width="5"/>
        <path d="M629 166q-4-15-15-16m22 13q0-14-7-18m15 16q6-13 1-20" stroke-width="3" fill="none"/>
        <g id="head">
          <path d="M664 198 821 213q-39 55-95 52c-36-2-55-24-62-67Z" fill="url(#beak)" stroke-width="3"/>
          <path d="M684 224q29 41 77 26" stroke="#dd944b" stroke-width="2" fill="none"/>
          <path d="M664 193q77 0 164 22-85 9-165-8Z" fill="#f8bf62" stroke-width="3"/>
          <path d="M810 213h18l-7 7" stroke-width="2" fill="none"/>
          <circle cx="650" cy="188" r="12" fill="#fffdf1" stroke="none"/>
          <g id="eye"><circle cx="653" cy="188" r="5.5" fill="#294d58" stroke="none"/><circle cx="655" cy="186" r="1.6" fill="white" stroke="none"/></g>
          <path d="M641 173q7-5 14-1" stroke-width="2" fill="none"/>
          <ellipse cx="644" cy="208" rx="9" ry="5" fill="#edc6ae" stroke="none" opacity=".8"/>
        </g>
        <path id="scarf-tail" d="M611 263Q574 252 555 269T494 265L502 282Q537 300 564 280T611 278Z" fill="#df6a55" stroke-width="2.5"/>
        <path d="M609 254q12 9 25 7l-3 16q-14 3-28-9Z" fill="#ed7b61" stroke-width="3"/>
        <path d="M607 266q-7 11-2 17l11-8Z" fill="#c95a49" stroke-width="2"/>
        <path d="M528 319c22-24 46-18 70 2l49 28q33 3 55 9c7 4 5 11-4 13l-64-6c-24-4-48-10-66-24" fill="#eef1e4" stroke-width="3"/>
        <path d="m543 327 39 19m-40-9 27 13" fill="none" stroke="#b9cec3" stroke-width="2"/>
      </g>
      <path id="near-leg" d="M575 385 617 438 632 511" fill="none" stroke="#e7ac55" stroke-width="14"/>
      <path id="near-foot" d="M620 511q10-9 29 0l-3 5h-27Z" fill="#efb65c" stroke-width="2.5"/>
      <path id="near-pedal" d="M617 520h32" fill="none" stroke-width="5"/>
      <circle cx="600" cy="511" r="5" fill="#294d58" stroke="none"/>
      <path d="M715 351q0-10 9-10t9 10Z" fill="#e6b955" stroke-width="2"/><path d="M724 339v-3" stroke-width="2"/>
      <g id="bell-lines" opacity="0" fill="none" stroke="#c58e39" stroke-width="2.5"><path d="M739 334q8 7 7 17M747 326q13 12 11 27M709 334q-6 6-6 13"/></g>
    </g>
    <g id="foreground"><use href="#flowers" x="115" y="644"/><use href="#grass" x="310" y="675"/><use href="#flowers" transform="translate(1040 640) scale(1.3)"/><use href="#grass" x="1167" y="673"/><use href="#flowers" x="1315" y="644"/><use href="#grass" x="1510" y="675"/><use href="#flowers" transform="translate(2240 640) scale(1.3)"/><use href="#grass" x="2367" y="673"/></g>
  </svg>
  <span class="scene-note">沿着海岸，慢慢来就好。</span>
  </div>
  <div class="controls" aria-label="动画控制">
    <div class="buttons">
      <button id="toggle" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="toggle-icon" d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg><span id="toggle-text">暂停一下</span></button>
      <button id="bell" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 14h12c-2-2-2-4-2-6a4 4 0 0 0-8 0c0 2 0 4-2 6ZM8 17h4M10 2V1" stroke-linecap="round"/></svg>叮铃铃</button>
    </div>
    <div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speed-value" for="speed">1×</output></div>
  </div>
  <footer><span>不赶路，只感受风。</span><span class="status" id="status" role="status" aria-live="polite">空格键也可以暂停</span></footer>
</main>
<script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = motion.matches, speed = 1, time = 0, previous = null, bellUntil = 0, audio;
    const mobile = window.matchMedia('(max-width: 600px)');
    function resizeScene() { $('landscape').setAttribute('viewBox', mobile.matches ? '300 120 620 570' : '0 0 1200 700'); }
    resizeScene(); mobile.addEventListener('change', resizeScene);
    const spokes = [...document.querySelectorAll('.spokes')];
    // Each use instance has its own SVG shadow tree, so rotate the source spokes.
    function draw(t) {
      const phase = t * 2.6, degrees = phase * 180 / Math.PI;
      const roll = degrees * 1.85;
      spokes.forEach(el => el.setAttribute('transform', `rotate(${roll})`));
      $('rear-spin').setAttribute('transform', `rotate(${roll})`);
      $('front-spin').setAttribute('transform', `rotate(${roll})`);
      const x = 600 + 32 * Math.cos(phase), y = 511 + 32 * Math.sin(phase);
      const fx = 1200 - x, fy = 1022 - y;
      $('crank').setAttribute('d', `M${fx} ${fy}L${x} ${y}`);
      // Two-link inverse kinematics keeps both feet on opposite pedals.
      function leg(px, py) {
        const hx = 575, hy = 385, a = 90, b = 84;
        const dx = px-hx, dy = py-hy, d = Math.hypot(dx,dy);
        const mid = (a*a-b*b+d*d)/(2*d), height = Math.sqrt(Math.max(0,a*a-mid*mid));
        return `M${hx} ${hy}L${hx+mid*dx/d+height*dy/d} ${hy+mid*dy/d-height*dx/d}L${px} ${py}`;
      }
      $('near-leg').setAttribute('d', leg(x,y));
      $('far-leg').setAttribute('d', leg(fx,fy));
      $('near-foot').setAttribute('d', `M${x-12} ${y}q10-9 29 0l-3 5h-27Z`);
      $('near-pedal').setAttribute('d', `M${x-15} ${y+8}h32`);
      $('far-foot').setAttribute('d', `M${fx-12} ${fy}h29`);
      $('rider').setAttribute('transform', `translate(0 ${Math.sin(phase*2)*1.4})`);
      $('scarf-tail').setAttribute('d', `M611 263Q574 ${252+Math.sin(phase*2)*5} 555 269T494 ${265+Math.sin(phase*2+1)*9}L502 ${282+Math.sin(phase*2+1)*9}Q537 ${300+Math.sin(phase*2)*5} 564 280T611 278Z`);
      const blink = t % 5.3;
      $('eye').setAttribute('transform', blink>5.12 ? 'translate(0 188) scale(1 .12) translate(0 -188)' : '');
      const distance = t * 2.6 * 1.85 * 83;
      $('road-lines').setAttribute('patternTransform', `translate(${-distance%250} 0)`);
      $('sea-lines').setAttribute('patternTransform', `translate(${-distance*.1%330} 0)`);
      $('foreground').setAttribute('transform', `translate(${-distance%1200} 0)`);
      $('back-plants').setAttribute('transform', `translate(${-distance*.45%1200} 0)`);
      $('clouds').setAttribute('transform', `translate(${-t*8%1200} 0)`);
      $('sailboat').setAttribute('transform', `translate(${1100-(t*10)%1400} ${353+Math.sin(t)*1.8})`);
    }
    function updateButton() {
      $('toggle-text').textContent = paused ? '继续兜风' : '暂停一下';
      $('toggle-icon').setAttribute('d', paused ? 'M6 3 16 10 6 17Z' : 'M5 4h3v12H5zm7 0h3v12h-3z');
      $('toggle').setAttribute('aria-pressed', String(paused));
    }
    function toggle() { paused = !paused; updateButton(); }
    $('toggle').addEventListener('click', toggle);
    $('speed').addEventListener('input', e => { speed = Number(e.target.value); $('speed-value').value = `${speed}×`; });
    document.addEventListener('keydown', e => {
      if(e.code === 'Space' && !e.repeat && !['INPUT','BUTTON','TEXTAREA','SELECT'].includes(e.target.tagName)) { e.preventDefault(); toggle(); }
    });
    motion.addEventListener('change', e => { paused = e.matches; updateButton(); });
    document.addEventListener('visibilitychange', () => { previous = null; });
    $('bell').addEventListener('click', async () => {
      bellUntil = performance.now()+900;
      $('status').textContent = '叮铃铃，海风借过！';
      try {
        const Context = window.AudioContext || window.webkitAudioContext;
        if(!Context) return;
        audio ||= new Context();
        await audio.resume();
        [0, .14].forEach(delay => {
          [1568, 3136].forEach((frequency, index) => {
            const oscillator = audio.createOscillator(), gain = audio.createGain();
            const start = audio.currentTime + delay;
            oscillator.type = 'sine'; oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(index ? .025 : .12, start+.005);
            gain.gain.exponentialRampToValueAtTime(.0001, start+.65);
            oscillator.connect(gain); gain.connect(audio.destination);
            oscillator.start(start); oscillator.stop(start+.7);
            oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
          });
        });
      } catch { $('status').textContent = '叮铃铃！（当前浏览器未启用声音）'; }
    });
    function frame(now) {
      if(previous !== null && !paused) { time += Math.min((now-previous)/1000,.05)*speed; draw(time); }
      previous = now;
      $('bell-lines').setAttribute('opacity', now<bellUntil ? String(.55+.45*Math.sin(now*.035)) : '0');
      requestAnimationFrame(frame);
    }
    draw(0); updateButton(); requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
